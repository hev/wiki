[project]
name = "wiki"
version = "0.1.0"
description = "Auto-routed hybrid Wikipedia search through hev layer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "mwparserfromhell>=0.7",
  "mwxml>=0.3",
  "pydantic-settings>=2.3",
  "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.24",
  "respx>=0.22",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
